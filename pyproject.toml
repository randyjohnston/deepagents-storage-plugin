[project]
name = "deepagents-blob"
version = "0.1.0"
description = "Pluggable large-file offloading for deepagents: OffloadingBackend + BlobStore adapters (S3-compatible, Box, Egnyte, in-memory)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2",
]

[project.optional-dependencies]
s3 = ["boto3"]
box = ["box-sdk-gen"]
egnyte = ["requests"]
# examples/chat.py: sqlite checkpointer for sessions that survive a restart,
# plus .env loading for the store credentials.
chat = ["langgraph-checkpoint-sqlite>=3.1,<4", "python-dotenv>=1.0"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_blob"]
